name: Check audit action
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  compare:
    strategy:
      matrix:
        runner: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - id: audit
        uses: ./
        with:
          csv-path: example.csv
      - name: Verify audit outputs
        shell: bash
        env:
          EXPECTED_MATCHED: ${{ steps.audit.outputs.matched-comparisons }}
          EXPECTED_PRESENCE: ${{ steps.audit.outputs.presence-changes }}
          EXPECTED_LINK: ${{ steps.audit.outputs.link-changes }}
        run: |
          test "$EXPECTED_MATCHED" = 5
          test "$EXPECTED_PRESENCE" = 2
          test "$EXPECTED_LINK" = 2
      - id: missing
        uses: ./
        continue-on-error: true
        with:
          csv-path: absent.csv
      - name: Verify invalid input fails without counts
        shell: bash
        env:
          OUTCOME: ${{ steps.missing.outcome }}
          MATCHED: ${{ steps.missing.outputs.matched-comparisons }}
        run: |
          test "$OUTCOME" = failure
          test -z "$MATCHED"
